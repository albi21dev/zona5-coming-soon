<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zona 5 — Stiamo arrivando</title>
<meta name="description" content="Il nuovo sito di Zona 5 sta arrivando: laboratorio di test fisiologici a Cesena.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Didact+Gothic&display=swap" rel="stylesheet">
<style>
  :root{
    --fill1a:#121212;
    --fill1b:#1D1F21;
    --fill1c:#141516;
    --text1:#F5F5F5;
    --text2:#8C8C8C;
    --surf1:#219CBA;
    --pannello:rgba(245,245,245,.045);
    --filo:rgba(245,245,245,.13);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    position:relative;
    font-family:"Didact Gothic",Helvetica,Arial,sans-serif;
    background:linear-gradient(158deg,var(--fill1a) 0%,var(--fill1b) 54%,var(--fill1c) 100%);
    color:var(--text1);
    display:flex;
    align-items:center;
    justify-content:flex-start;
    min-height:100vh;
    padding:32px clamp(24px,9vw,120px);
    overflow:hidden;
  }
  .bg-logo{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:min(78vw,760px);
    height:auto;
    opacity:.9;
    z-index:0;
    pointer-events:none;
  }
  .wrap{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:22px;
    text-align:left;
    max-width:560px;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:7px 14px;
    border:1px solid var(--filo);
    border-radius:999px;
    background:var(--pannello);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--text2);
  }
  .badge .dot{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--surf1);
    box-shadow:0 0 6px var(--surf1);
    flex:none;
  }
  h1{
    font-family:"Outfit",Helvetica,Arial,sans-serif;
    font-weight:600;
    font-size:clamp(34px,7vw,58px);
    line-height:1.05;
    letter-spacing:-1.2px;
    color:var(--text1);
  }
  p.lead{
    font-size:15px;
    line-height:1.7;
    color:var(--text2);
    max-width:460px;
    text-align:left;
  }
  .countdown{
    display:flex;
    gap:10px;
    margin-top:8px;
  }
  .cbox{
    width:74px;
    padding:14px 0 12px;
    border:1px solid var(--filo);
    border-radius:10px;
    background:var(--pannello);
  }
  .cbox .num{
    font-family:"Outfit",Helvetica,Arial,sans-serif;
    font-weight:600;
    font-size:28px;
    letter-spacing:-.5px;
    color:var(--text1);
    font-variant-numeric:tabular-nums;
  }
  .cbox .lbl{
    margin-top:4px;
    font-size:9.5px;
    letter-spacing:1.6px;
    text-transform:uppercase;
    color:var(--text2);
  }
  @media (max-width:420px){
    .cbox{width:64px;padding:11px 0 9px}
    .cbox .num{font-size:22px}
  }
</style>
</head>
<body>
  <img class="bg-logo" src="logo-dark-clean.svg" alt="" aria-hidden="true">
  <div class="wrap">
    <span class="badge"><span class="dot"></span>Zona5 — Performance Lab</span>
    <h1>Costruiamo la tua performance</h1>
    <p class="lead">Laboratorio di test fisiologici a Cesena: test VO₂max con metabolimetro, bike fitting, coaching e ginnastica posturale, individuale e in gruppo.</p>
    <div class="countdown" id="countdown">
      <div class="cbox"><div class="num" id="cd-d">00</div><div class="lbl">Giorni</div></div>
      <div class="cbox"><div class="num" id="cd-h">00</div><div class="lbl">Ore</div></div>
      <div class="cbox"><div class="num" id="cd-m">00</div><div class="lbl">Min</div></div>
      <div class="cbox"><div class="num" id="cd-s">00</div><div class="lbl">Sec</div></div>
    </div>
  </div>
  <script>
    var target = new Date("2026-10-01T09:00:00+02:00").getTime();
    function pad(n){ return String(n).padStart(2,"0"); }
    function tick(){
      var diff = target - Date.now();
      if (diff < 0) diff = 0;
      var d = Math.floor(diff / 86400000);
      var h = Math.floor((diff % 86400000) / 3600000);
      var m = Math.floor((diff % 3600000) / 60000);
      var s = Math.floor((diff % 60000) / 1000);
      document.getElementById("cd-d").textContent = pad(d);
      document.getElementById("cd-h").textContent = pad(h);
      document.getElementById("cd-m").textContent = pad(m);
      document.getElementById("cd-s").textContent = pad(s);
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
